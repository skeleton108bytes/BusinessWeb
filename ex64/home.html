<html>
<head>
    <meta charset="UTF-8">
    <title>Table tương tác</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid black;
            padding: 10px;
            font-size: 16px;
        }

        .header-right {
            text-align: right;
        }

        .container {
            width: 380px;
            margin: 0 auto;
            padding: 5px;
            border: 1px solid black;
        }

        #clock {
            margin-bottom: 20px;
        }

        #message {
            cursor: pointer;
            margin-bottom: 12px;
        }

        #dataTable {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 28px;
        }

        #dataTable td {
            border: 1px solid #aaa;
            padding: 2px;
        }

        #dataTable tr {
            cursor: pointer;
        }

        .selected {
            background-color: red;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hiển thị giờ hiện tại -->
        <div id="clock"></div>
        <!-- Thông báo chuột trái / chuột phải -->
        <div id="message">
            Click chuột vào dòng này. Sẽ xuất hiện thông báo phím bấm của chuột
        </div>
        <!-- Bảng dữ liệu -->
        <table id="dataTable">
            <tbody>
                <tr>
                    <td>Thêm dòng mới ở đây</td>
                    <td>Thêm dòng mới ở đây</td>
                </tr>
                <tr>
                    <td>Thêm dòng mới ở đây</td>
                    <td>Thêm dòng mới ở đây</td>
                </tr>
                <tr>
                    <td>Thêm dòng mới ở đây</td>
                    <td>Thêm dòng mới ở đây</td>
                </tr>
                <tr>
                    <td>Dòng 1 cột 1</td>
                    <td>Dòng 1 cột 2</td>
                </tr>
                <tr>
                    <td>Dòng 2 cột 1</td>
                    <td>Dòng 2 cột 2</td>
                </tr>
                <tr>
                    <td>Dòng 3 cột 1</td>
                    <td>Dòng 3 cột 2</td>
                </tr>
            </tbody>
        </table>
        <!-- Các nút chức năng -->
        <div class="buttons">
            <button onclick="addRow()">Thêm vào</button>
            <button onclick="deleteRows()">Xóa</button>
            <button onclick="showOnlyRow()">Chỉ hiện dòng</button>
            <button onclick="showOnlyColumn()">Chỉ hiện cột</button>
            <button onclick="openNewPage()">Mở một trang mới</button>
        </div>
    </div>
    <script>
        // 1. Hiển thị giờ hiện tại của máy tính client
        function updateClock() {
            const now = new Date();
            document.getElementById("clock").textContent =
                now.toLocaleTimeString("vi-VN", {
                    hour12: false
                });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 2. Thông báo khi nhấn chuột trái
        const message = document.getElementById("message");
        message.addEventListener("click", function () {
            alert("Bạn vừa nhấn chuột trái!");
        });
        // Thông báo khi nhấn chuột phải
        message.addEventListener("contextmenu", function (event) {
            event.preventDefault();
            alert("Bạn vừa nhấn chuột phải!");
        });

        // 3. Click vào dòng để đổi nền đỏ
        const table = document.getElementById("dataTable");
        table.addEventListener("click", function (event) {
            const row = event.target.closest("tr");

            if (row && table.contains(row)) {
                row.classList.toggle("selected");
            }
        });

        // 4. Thêm dòng mới vào bảng
        function addRow() {
            const tbody = table.querySelector("tbody");
            const newRow = tbody.insertRow();

            const cell1 = newRow.insertCell();
            const cell2 = newRow.insertCell();

            cell1.textContent = "Dòng mới cột 1";
            cell2.textContent = "Dòng mới cột 2";
        }

        // 5. Xóa tất cả các dòng đang có nền đỏ
        function deleteRows() {
            const selectedRows = table.querySelectorAll(
                "tr.selected"
            );

            if (selectedRows.length === 0) {
                alert("Vui lòng chọn dòng cần xóa!");
                return;
            }

            selectedRows.forEach(function (row) {
                row.remove();
            });
        }

        // 6. Chỉ hiển thị một dòng được chọn
        function showOnlyRow() {
            const rows = table.querySelectorAll("tr");

            const rowNumber = prompt(
                "Nhập số thứ tự dòng muốn hiển thị (1 đến " +
                rows.length + "):"
            );

            if (rowNumber === null || rowNumber.trim() === "") {
                return;
            }

            const index = Number(rowNumber);

            if (!Number.isInteger(index) ||
                index < 1 || index > rows.length) {
                alert("Số thứ tự dòng không hợp lệ!");
                return;
            }

            rows.forEach(function (row, i) {
                row.style.display = (i === index - 1) ? "" : "none";
            });
        }

        // 7. Chỉ hiển thị một cột được chọn
        function showOnlyColumn() {
            const rows = table.querySelectorAll("tr");

            if (rows.length === 0) {
                return;
            }

            const columnCount = rows[0].cells.length;

            const columnNumber = prompt(
                "Nhập số thứ tự cột muốn hiển thị (1 đến " +
                columnCount + "):"
            );

            if (columnNumber === null ||
                columnNumber.trim() === "") {
                return;
            }

            const index = Number(columnNumber);

            if (!Number.isInteger(index) ||
                index < 1 || index > columnCount) {
                alert("Số thứ tự cột không hợp lệ!");
                return;
            }

            rows.forEach(function (row) {
                Array.from(row.cells).forEach(function (cell, i) {
                    cell.style.display =
                        (i === index - 1) ? "" : "none";
                });
            });
        }

        // 8. Mở trang web trong tab mới
        function openNewPage() {
            window.open(
                "https://tranduythanh.com/",
                "_blank"
            );
        }
    </script>
</body>
</html>
